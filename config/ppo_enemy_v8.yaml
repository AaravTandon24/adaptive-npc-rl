behaviors:
  EnemyAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512          # Stabilizes value estimates
      buffer_size: 4096        # More experience before each update
      learning_rate: 2.0e-4    # Avoid overshooting
      beta: 8.0e-4             # High entropy bonus for longer exploration
      epsilon: 0.15            # Conservative clipping updates
      lambd: 0.95
      num_epoch: 4
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 320        # Extra capacity for 38 observations (v7/v8)
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 1000000         # Target at least 500k-1M steps for convergence
    time_horizon: 256
    summary_freq: 10000

# DDAAgent is intentionally EXCLUDED from this config.
# Train EnemyAgent in isolation against a static difficulty environment
# (set DanmakuDDAController to a fixed mid-range profile in the scene,
#  or disable it entirely). Once EnemyAgent v8 is trained and exported
# as EnemyAgent_v8.onnx, switch its Behavior Type to Inference Only,
# then retrain DDAAgent using ppo_dual_agent.yaml.
