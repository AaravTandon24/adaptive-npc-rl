behaviors:
  EnemyAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512          # Stabilizes value estimates
      buffer_size: 4096        # More experience before each update
      learning_rate: 2.0e-4    # Avoid overshooting
      beta: 8.0e-4             # High entropy bonus for longer exploration
      epsilon: 0.15            # Conservative clipping updates
      lambd: 0.95
      num_epoch: 4
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 320        # Extra capacity for 38 observations (v7)
      num_layers: 3            # Add depth for complex spatial tracking
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 1000000       # Target at least 500k-1M steps for convergence
    time_horizon: 256        # Collect longer trajectories per agent update
    summary_freq: 10000

  DDAAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 64           # Increased batch size for stable policy updates
      buffer_size: 512         # Larger buffer size for representative PPO experience
      learning_rate: 3.0e-4
      beta: 1.0e-3             # Lower entropy to accelerate policy exploitation
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 4
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128        # Small network for 10 observations
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 50000           # ~5000 game episodes
    time_horizon: 10           # 10 game episodes = 1 meta-episode
    summary_freq: 100
